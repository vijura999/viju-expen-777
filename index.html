<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>EVR Expenses</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fb;
  color:#20242c;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  height:86px;
  background:#101827;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
}

.logo{
  font-size:31px;
  font-weight:800;
}

.logo span{
  color:#fff;
}

.profile{
  font-size:21px;
}

.nav{
  background:white;
  display:flex;
  gap:10px;
  padding:16px;
  border-bottom:1px solid #ddd;
  overflow-x:auto;
}

.nav button{
  border:0;
  background:#edf1f6;
  color:#2361d9;
  padding:14px 24px;
  border-radius:12px;
  font-size:19px;
  white-space:nowrap;
}

.nav button.active{
  background:#2865e5;
  color:white;
}

.container{
  max-width:1500px;
  margin:auto;
  padding:28px;
  padding-bottom:110px;
}

h1{
  font-size:42px;
  margin:5px 0 30px;
}

h2{
  margin-top:0;
  font-size:27px;
}

h3{
  font-size:21px;
}

.card{
  background:white;
  border-radius:22px;
  padding:25px;
  margin-bottom:24px;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.period-card{
  padding:26px;
}

.period-title{
  font-size:27px;
  font-weight:800;
  margin-bottom:22px;
}

.period-row{
  display:flex;
  gap:18px;
}

.period-row label{
  font-weight:700;
  font-size:18px;
}

.period-row select{
  display:block;
  margin-top:8px;
  min-width:150px;
  padding:13px;
  border:1px solid #ccd3df;
  border-radius:12px;
  background:white;
}

.info{
  background:#edf5ff;
  border-left:6px solid #2865e5;
  padding:18px;
  border-radius:10px;
  font-size:18px;
  margin-bottom:24px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.stat{
  background:white;
  border-radius:20px;
  padding:25px;
  border-left:7px solid #2865e5;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.stat.paid{
  border-left-color:#39a85a;
}

.stat.pending{
  border-left-color:#e7a628;
}

.stat.overdue{
  border-left-color:#d93b36;
}

.stat.bank{
  border-left-color:#7a42df;
}

.stat.cash{
  border-left-color:#1d9b79;
}

.stat-title{
  color:#697285;
  font-size:18px;
}

.stat-value{
  font-size:31px;
  font-weight:800;
  margin-top:12px;
}

.people-line{
  background:#f4f8ff;
  border:1px solid #d4dfef;
  border-radius:12px;
  padding:13px 17px;
  margin-top:20px;
}

.people-line strong{
  font-size:19px;
}

.people-tags{
  display:inline-flex;
  gap:8px;
  flex-wrap:wrap;
  margin-left:10px;
}

.people-tag{
  background:#edf4ff;
  padding:5px 9px;
  border-radius:5px;
  font-weight:700;
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}

th{
  background:#2865e5;
  color:white;
  text-align:left;
  padding:13px;
  font-size:17px;
}

td{
  padding:12px;
  border:1px solid #d8dde5;
  background:#fff;
}

tr:nth-child(even) td{
  background:#f8fafc;
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  font-weight:700;
}

.badge.paid{
  background:#d8f6e3;
  color:#14823c;
}

.badge.pending{
  background:#fff0ca;
  color:#986500;
}

.badge.overdue{
  background:#ffdede;
  color:#b52424;
}

.btn{
  border:0;
  padding:10px 15px;
  border-radius:9px;
  font-weight:700;
}

.btn-primary{
  background:#2865e5;
  color:white;
}

.btn-success{
  background:#20a653;
  color:white;
}

.btn-danger{
  background:#e22e2e;
  color:white;
}

.btn-secondary{
  background:#e9edf3;
  color:#20242c;
}

.btn-purple{
  background:#7444d9;
  color:white;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:nowrap;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:17px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  font-weight:700;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccd3df;
  border-radius:10px;
  background:white;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.search-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.search-row input,
.search-row select{
  padding:12px;
  border:1px solid #ccd3df;
  border-radius:10px;
}

.account-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.account{
  border:1px solid #d8dfea;
  border-radius:16px;
  padding:20px;
  background:white;
}

.account-name{
  font-size:21px;
  font-weight:800;
}

.account-balance{
  font-size:27px;
  font-weight:800;
  margin:15px 0;
}

.quick-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.quick-actions button{
  padding:16px;
  border:1px solid #d6dce7;
  background:white;
  border-radius:12px;
  font-weight:700;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:#101827;
  color:white;
  display:flex;
  justify-content:center;
  z-index:1000;
  box-shadow:0 -3px 12px rgba(0,0,0,.15);
}

.bottom-nav button{
  flex:1;
  max-width:180px;
  background:none;
  border:0;
  color:#dce3ef;
  font-size:13px;
}

.bottom-nav button.active{
  color:white;
  background:#2865e5;
}

.bottom-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.empty{
  text-align:center;
  color:#697285;
  padding:35px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:20px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  border:0;
  background:#eee;
  width:40px;
  height:40px;
  border-radius:50%;
}

.notice{
  padding:14px;
  border-radius:10px;
  background:#eef5ff;
  border-left:5px solid #2865e5;
  margin-top:15px;
}

@media(max-width:900px){
  .topbar{
    height:72px;
    padding:0 18px;
  }

  .logo{
    font-size:25px;
  }

  .container{
    padding:18px;
    padding-bottom:95px;
  }

  h1{
    font-size:37px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .two-col{
    grid-template-columns:1fr;
  }

  .account-grid{
    grid-template-columns:1fr;
  }

  .quick-actions{
    grid-template-columns:1fr 1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .bottom-nav button{
    font-size:10px;
  }

  .bottom-icon{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">EVR Expenses</div>
  <div class="profile">Personal</div>
</header>

<nav class="nav" id="topNav">
  <button data-page="dashboard">Dashboard</button>
  <button data-page="expenses">Expenses</button>
  <button data-page="upcoming">Upcoming</button>
  <button data-page="people">People</button>
  <button data-page="banks">Cash & Banks</button>
  <button data-page="reports">Reports</button>
</nav>

<main class="container" id="app"></main>

<nav class="bottom-nav">
  <button data-page="dashboard">
    <span class="bottom-icon">⌂</span>Home
  </button>

  <button data-page="expenses">
    <span class="bottom-icon">▣</span>Expenses
  </button>

  <button data-page="upcoming">
    <span class="bottom-icon">◷</span>Upcoming
  </button>

  <button data-page="people">
    <span class="bottom-icon">♙</span>People
  </button>

  <button data-page="banks">
    <span class="bottom-icon">🏦</span>Cash & Banks
  </button>

  <button data-page="reports">
    <span class="bottom-icon">▥</span>Reports
  </button>
</nav>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">Add</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* =========================================================
   EVR EXPENSES
   COMPLETE SINGLE FILE APP
========================================================= */

const KEY="EVR_EXPENSES_FINAL";

let db = JSON.parse(localStorage.getItem(KEY)) || {
  expenses:[],
  banks:[
    {id:"cash",name:"Cash",balance:0,type:"cash"}
  ],
  people:["Viju","Kittu","Viju","Saju","Anu","Social Tax","IRS"],
  transfers:[]
};

let currentPage="dashboard";

function saveDB(){
  localStorage.setItem(KEY,JSON.stringify(db));
}

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function money(n){
  return "₹"+Number(n||0).toLocaleString("en-IN",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function todayISO(){
  const d=new Date();
  return d.toISOString().slice(0,10);
}

function dateObj(x){
  return new Date(x+"T00:00:00");
}

function formatDate(x){
  if(!x)return "-";
  const d=dateObj(x);
  return String(d.getDate()).padStart(2,"0")+"-"+
         String(d.getMonth()+1).padStart(2,"0")+"-"+
         d.getFullYear();
}

function statusOf(e){
  if(e.status==="Paid")return "Paid";
  if(e.status==="Pending" && e.dueDate &&
     dateObj(e.dueDate)<dateObj(todayISO()))
    return "Overdue";
  return e.status || "Pending";
}

function monthName(m){
  return new Date(2000,m,1).toLocaleString("en-US",{month:"long"});
}

function getMonthYear(){
  const d=new Date();
  return {
    month:d.getMonth(),
    year:d.getFullYear()
  };
}

function getSelectedPeriod(){
  const m=document.getElementById("dashMonth");
  const y=document.getElementById("dashYear");

  if(!m || !y){
    return getMonthYear();
  }

  return {
    month:Number(m.value),
    year:Number(y.value)
  };
}

function expenseDate(e){
  return e.date || e.dueDate || "";
}

/* ---------------------------------------------------------
   BALANCE ENGINE
--------------------------------------------------------- */

function findAccount(id){
  return db.banks.find(b=>b.id===id);
}

function accountName(id){
  const a=findAccount(id);
  return a ? a.name : "-";
}

function rebuildBalances(){
  db.banks.forEach(b=>{
    b.balance=Number(b.openingBalance||0);
  });

  db.expenses.forEach(e=>{
    if(statusOf(e)!=="Paid")return;

    if(e.paymentType==="Other")return;

    const a=findAccount(e.accountId);

    if(a){
      a.balance-=Number(e.amount||0);
    }
  });

  db.transfers.forEach(t=>{
    const from=findAccount(t.fromId);
    const to=findAccount(t.toId);

    if(from)from.balance-=Number(t.amount||0);
    if(to)to.balance+=Number(t.amount||0);
  });

  db.transfers.forEach(t=>{
    if(t.type==="cashdeposit"){
      const to=findAccount(t.toId);
      if(to)to.balance+=Number(t.amount||0);
    }

    if(t.type==="atm"){
      const from=findAccount(t.fromId);
      if(from)from.balance-=Number(t.amount||0);
    }
  });

  saveDB();
}

/* ---------------------------------------------------------
   NAVIGATION
--------------------------------------------------------- */

function go(page){
  currentPage=page;

  document.querySelectorAll("[data-page]").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===page);
  });

  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.querySelectorAll("[data-page]").forEach(b=>{
  b.addEventListener("click",()=>go(b.dataset.page));
});

/* ---------------------------------------------------------
   DASHBOARD
--------------------------------------------------------- */

function dashboard(){
  const now=getMonthYear();

  const month=now.month;
  const year=now.year;

  const rows=db.expenses
    .filter(e=>{
      const d=dateObj(expenseDate(e));
      return d.getMonth()===month && d.getFullYear()===year;
    })
    .sort((a,b)=>dateObj(expenseDate(b))-dateObj(expenseDate(a)));

  const total=rows.reduce((s,e)=>s+Number(e.amount||0),0);
  const paid=rows.filter(e=>statusOf(e)==="Paid")
                 .reduce((s,e)=>s+Number(e.amount||0),0);
  const pending=rows.filter(e=>statusOf(e)==="Pending")
                    .reduce((s,e)=>s+Number(e.amount||0),0);
  const overdue=rows.filter(e=>statusOf(e)==="Overdue")
                    .reduce((s,e)=>s+Number(e.amount||0),0);

  const today=dateObj(todayISO());

  const next7=db.expenses
    .filter(e=>{
      if(statusOf(e)!=="Pending")return false;
      if(!e.dueDate)return false;

      const d=dateObj(e.dueDate);
      const diff=Math.round((d-today)/86400000);

      return diff>=0 && diff<=7;
    })
    .sort((a,b)=>dateObj(a.dueDate)-dateObj(b.dueDate));

  const latest=rows.slice(0,10);

  const balances=db.banks.reduce((s,b)=>s+Number(b.balance||0),0);
  const cash=db.banks
    .filter(b=>b.type==="cash")
    .reduce((s,b)=>s+Number(b.balance||0),0);

  const people=[...new Set(rows.map(e=>e.person).filter(Boolean))];

  return `
    <h1>Dashboard</h1>

    <div class="card period-card">

      <div class="period-title">
        Dashboard Period
      </div>

      <div class="period-row">
        <label>
          Month
          <select id="dashMonth"
                  onchange="dashboardPeriodChanged()">
            ${Array.from({length:12},(_,i)=>`
              <option value="${i}"
                ${i===month?"selected":""}>
                ${monthName(i)}
              </option>
            `).join("")}
          </select>
        </label>

        <label>
          Year
          <select id="dashYear"
                  onchange="dashboardPeriodChanged()">
            ${Array.from({length:8},(_,i)=>{
              const y=year-3+i;
              return `
                <option value="${y}"
                  ${y===year?"selected":""}>
                  ${y}
                </option>`;
            }).join("")}
          </select>
        </label>
      </div>

    </div>

    <div class="info">
      All expenses are recorded in ₹ INR.
      Data is automatically saved in this browser.
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-title">Total Expenses</div>
        <div class="stat-value">${money(total)}</div>
      </div>

      <div class="stat paid">
        <div class="stat-title">Paid</div>
        <div class="stat-value">${money(paid)}</div>
      </div>

      <div class="stat pending">
        <div class="stat-title">Pending</div>
        <div class="stat-value">${money(pending)}</div>
      </div>

      <div class="stat overdue">
        <div class="stat-title">Overdue</div>
        <div class="stat-value">${money(overdue)}</div>
      </div>

      <div class="stat bank">
        <div class="stat-title">Total Bank Balance</div>
        <div class="stat-value">${money(balances)}</div>
      </div>

      <div class="stat cash">
        <div class="stat-title">Cash Balance</div>
        <div class="stat-value">${money(cash)}</div>
      </div>

    </div>

    <div class="people-line">
      <strong>People:</strong>
      <span class="people-tags">
        ${people.map(p=>`
          <span class="people-tag">${escapeHTML(p)}</span>
        `).join("")}
      </span>
    </div>

    <div class="two-col">

      <div class="card">
        <div class="section-header">
          <h2>Upcoming — Next 7 Days</h2>
          <button class="btn btn-primary"
                  onclick="go('upcoming')">
            View All
          </button>
        </div>

        ${expenseTable(next7,true)}
      </div>

      <div class="card">
        <div class="section-header">
          <h2>Overdue Expenses</h2>
          <button class="btn btn-danger"
                  onclick="go('expenses')">
            View All
          </button>
        </div>

        ${expenseTable(
          db.expenses
            .filter(e=>statusOf(e)==="Overdue")
            .sort((a,b)=>dateObj(a.dueDate)-dateObj(b.dueDate))
            .slice(0,7),
          true
        )}
      </div>

    </div>

    <div class="card">

      <div class="section-header">
        <h2>Latest Transactions</h2>
        <button class="btn btn-secondary"
                onclick="go('expenses')">
          View All
        </button>
      </div>

      ${expenseTable(latest,false)}

    </div>

    <!-- Dashboard Period intentionally appears at top as selector,
         while current/latest transactions are shown below. -->

  `;
}

function dashboardPeriodChanged(){
  render();
}

/* ---------------------------------------------------------
   EXPENSE TABLE
--------------------------------------------------------- */

function expenseTable(rows,small){

  if(!rows.length){
    return `<div class="empty">No expenses found.</div>`;
  }

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Expense</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Person</th>
            <th>Payment</th>
            <th>Due</th>
            <th>Status</th>
            ${small?"":"<th>Actions</th>"}
          </tr>
        </thead>

        <tbody>
          ${rows.map(e=>`
            <tr>
              <td>${formatDate(e.date)}</td>
              <td>${escapeHTML(e.name)}</td>
              <td>${money(e.amount)}</td>
              <td>${escapeHTML(e.category||"-")}</td>
              <td>${escapeHTML(e.person||"-")}</td>
              <td>${escapeHTML(e.paymentType||"-")}</td>
              <td>${formatDate(e.dueDate)}</td>
              <td>
                <span class="badge ${statusOf(e).toLowerCase()}">
                  ${statusOf(e)}
                </span>
              </td>

              ${small?"":`
                <td>
                  <div class="actions">
                    <button class="btn btn-success"
                            onclick="editExpense('${e.id}')">
                      Edit
                    </button>

                    <button class="btn btn-danger"
                            onclick="deleteExpense('${e.id}')">
                      Delete
                    </button>
                  </div>
                </td>
              `}
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

/* ---------------------------------------------------------
   EXPENSES PAGE
--------------------------------------------------------- */

function expensesPage(){

  const rows=[...db.expenses]
    .sort((a,b)=>{
      return dateObj(expenseDate(b))-dateObj(expenseDate(a));
    });

  return `
    <h1>Expenses</h1>

    <div class="card">

      <div class="section-header">
        <h2>All Expenses</h2>

        <button class="btn btn-primary"
                onclick="addExpense()">
          + Add Expense
        </button>
      </div>

      <div class="search-row">
        <input id="expenseSearch"
               placeholder="Search expense, category, person..."
               oninput="filterExpenses()">

        <select id="expenseStatus"
                onchange="filterExpenses()">
          <option value="">All Status</option>
          <option>Paid</option>
          <option>Pending</option>
          <option>Overdue</option>
        </select>

        <select id="expensePerson"
                onchange="filterExpenses()">
          <option value="">All People</option>
          ${[...new Set(db.people)].map(p=>`
            <option>${escapeHTML(p)}</option>
          `).join("")}
        </select>
      </div>

      <div id="expenseTable">
        ${expenseTable(rows,false)}
      </div>

    </div>
  `;
}

function filterExpenses(){

  const search=(document.getElementById("expenseSearch")?.value||"")
    .toLowerCase();

  const status=document.getElementById("expenseStatus")?.value||"";
  const person=document.getElementById("expensePerson")?.value||"";

  let rows=db.expenses.filter(e=>{

    const text=[
      e.name,
      e.category,
      e.person,
      e.paymentType,
      e.notes
    ].join(" ").toLowerCase();

    return (!search||text.includes(search))
      && (!status||statusOf(e)===status)
      && (!person||e.person===person);
  });

  rows.sort((a,b)=>dateObj(expenseDate(b))-dateObj(expenseDate(a)));

function saveExpense(event,id){

  event.preventDefault();

  const old=id ? db.expenses.find(e=>e.id===id) : null;

  const e={
    id:id||uid(),
    name:document.getElementById("fName").value.trim(),
    amount:Number(document.getElementById("fAmount").value||0),
    date:document.getElementById("fDate").value,
    dueDate:document.getElementById("fDue").value,
    category:document.getElementById("fCategory").value.trim(),
    person:document.getElementById("fPerson").value,
    status:document.getElementById("fStatus").value,
    paymentType:document.getElementById("fPayment").value,
    accountId:document.getElementById("fAccount")?.value||"",
    notes:document.getElementById("fNotes").value
  };

  if(old){
    Object.assign(old,e);
  }else{
    db.expenses.push(e);
  }

  saveDB();
  rebuildBalances();
  closeModal();
  render();
}

function bankTransactionsTable(){

  const transactions=[];

  db.transfers.forEach(t=>{

    let description="";

    if(t.type==="bankbank"){
      description=
        `${accountName(t.fromId)} → ${accountName(t.toId)}`;
    }

    if(t.type==="cashbank"){
      description=
        `Cash → ${accountName(t.toId)}`;
    }

    if(t.type==="cashdeposit"){
      description=
        `Cash Deposit → ${accountName(t.toId)}`;
    }

    if(t.type==="atm"){
      description=
        `ATM Withdrawal ← ${accountName(t.fromId)}`;
    }

    transactions.push({
      date:t.date,
      type:t.type,
      description,
      amount:t.amount
    });
  });

  if(!transactions.length){
    return `<div class="empty">No bank/cash transactions.</div>`;
  }

  transactions.sort((a,b)=>
    dateObj(b.date)-dateObj(a.date)
  );

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Transaction</th>
            <th>Amount</th>
          </tr>
        </thead>

        <tbody>
          ${transactions.map(t=>`
            <tr>
              <td>${formatDate(t.date)}</td>
              <td>${escapeHTML(t.type)}</td>
              <td>${escapeHTML(t.description)}</td>
              <td>${money(t.amount)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

/* ---------------------------------------------------------
   PDF REPORTS
--------------------------------------------------------- */

function pdfTable(rows){

  return `
    <table>

      <thead>
        <tr>
          <th>Date</th>
          <th>Expense</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Person</th>
          <th>Payment</th>
          <th>Due</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        ${rows.map(e=>`
          <tr>
            <td>${formatDate(e.date)}</td>
            <td>${escapeHTML(e.name)}</td>
            <td>${money(e.amount)}</td>
            <td>${escapeHTML(e.category||"-")}</td>
            <td>${escapeHTML(e.person||"-")}</td>
            <td>${escapeHTML(e.paymentType||"-")}</td>
            <td>${formatDate(e.dueDate)}</td>
            <td>${statusOf(e)}</td>
          </tr>
        `).join("")}
      </tbody>

    </table>
  `;
}

function expensesPDF(){

  const rows=[...db.expenses]
    .sort((a,b)=>dateObj(expenseDate(b))-dateObj(expenseDate(a)));

  const total=rows.reduce((s,e)=>s+Number(e.amount||0),0);

  const people=[...new Set(rows.map(e=>e.person).filter(Boolean))];

  const content=`

    <h1>EVR Expenses</h1>

    <div class="subtitle">
      All Expenses · Total ${money(total)}
    </div>

    <div class="people">
      <strong>People:</strong>
      ${people.map(p=>`
        <span style="margin-left:8px;font-weight:bold">
          ${escapeHTML(p)}
        </span>
      `).join(" · ")}
    </div>

    ${pdfTable(rows)}

    <div class="total">
      Total Expenses: ${money(total)}
    </div>
  `;

  printPDF("EVR Expenses",content);
}

function monthlyPDF(){

  const {month,year}=getMonthYear();

  const rows=db.expenses.filter(e=>{
    const d=dateObj(expenseDate(e));
    return d.getMonth()===month &&
           d.getFullYear()===year;
  }).sort((a,b)=>dateObj(expenseDate(b))-dateObj(expenseDate(a)));

  const total=rows.reduce((s,e)=>s+Number(e.amount||0),0);
  const paid=rows.filter(e=>statusOf(e)==="Paid")
                 .reduce((s,e)=>s+Number(e.amount||0),0);
  const pending=rows.filter(e=>statusOf(e)==="Pending")
                    .reduce((s,e)=>s+Number(e.amount||0),0);
  const overdue=rows.filter(e=>statusOf(e)==="Overdue")
                    .reduce((s,e)=>s+Number(e.amount||0),0);

  const content=`

    <h1>EVR Dashboard</h1>

    <div class="subtitle">
      ${monthName(month)} ${year} · Total ${money(total)}
    </div>

    <div class="cards">

      <div class="card">
        <div class="card-title">Total</div>
        <div class="card-value">${money(total)}</div>
      </div>

      <div class="card">
        <div class="card-title">Paid</div>
        <div class="card-value">${money(paid)}</div>
      </div>

      <div class="card">
        <div class="card-title">Pending</div>
        <div class="card-value">${money(pending)}</div>
      </div>

      <div class="card">
        <div class="card-title">Overdue</div>
        <div class="card-value">${money(overdue)}</div>
      </div>

    </div>

    <div class="people">
      <strong>People:</strong>
      ${[...new Set(rows.map(e=>e.person).filter(Boolean))]
        .map(p=>`
          <span style="margin-left:8px;font-weight:bold">
            ${escapeHTML(p)}
          </span>
        `).join(" · ")}
    </div>

    ${pdfTable(rows)}

  `;

  printPDF("EVR Dashboard",content);
}

function peoplePDF(){

  const people=[...new Set(db.people)];

  let html="";

  people.forEach(person=>{

    const rows=db.expenses
      .filter(e=>e.person===person)
      .sort((a,b)=>dateObj(expenseDate(b))-dateObj(expenseDate(a)));

    const total=rows.reduce(
      (s,e)=>s+Number(e.amount||0),0
    );

    html+=`

      <h1>EVR Person Report</h1>

      <div class="subtitle">
        People: <strong>${escapeHTML(person)}</strong>
      </div>

      <div class="total">
        Total: ${money(total)}
      </div>

      <br>

      ${pdfTable(rows)}

      <br><br>

    `;
  });

  printPDF("EVR People Reports",html);
}

function cashBankPDF(){

  let html=`

    <h1>EVR Cash & Banks</h1>

    <div class="subtitle">
      Bank and Cash Accounts
    </div>

    <div class="cards">

  `;

  db.banks.forEach(b=>{
    html+=`
      <div class="card">
        <div class="card-title">
          ${escapeHTML(b.name)}
        </div>
        <div class="card-value">
          ${money(b.balance)}
        </div>
      </div>
    `;
  });

  html+=`
    </div>

    <h2>Transactions</h2>

    ${bankTransactionsPDF()}

    <div class="total">
      Total Available Balance:
      ${money(
        db.banks.reduce((s,b)=>s+Number(b.balance||0),0)
      )}
    </div>
  `;

  printPDF("EVR Cash & Banks",html);
}

function bankTransactionsPDF(){

  const transactions=[];

  db.transfers.forEach(t=>{

    let desc="";

    if(t.type==="bankbank"){
      desc=`${accountName(t.fromId)} → ${accountName(t.toId)}`;
    }

    if(t.type==="cashbank"){
      desc=`Cash → ${accountName(t.toId)}`;
    }

    if(t.type==="cashdeposit"){
      desc=`Cash Deposit → ${accountName(t.toId)}`;
    }

    if(t.type==="atm"){
      desc=`ATM Withdrawal ← ${accountName(t.fromId)}`;
    }

    transactions.push({
      date:t.date,
      type:t.type,
      desc,
      amount:t.amount
    });
  });

  transactions.sort((a,b)=>dateObj(b.date)-dateObj(a.date));

  return `
    <table>

      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Transaction</th>
          <th>Amount</th>
        </tr>
      </thead>

      <tbody>

        ${transactions.map(t=>`
          <tr>
            <td>${formatDate(t.date)}</td>
            <td>${escapeHTML(t.type)}</td>
            <td>${escapeHTML(t.desc)}</td>
            <td>${money(t.amount)}</td>
          </tr>
        `).join("")}

      </tbody>

    </table>
  `;
}

--------------------------------------------------------- */

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

/* ---------------------------------------------------------
   SECURITY / HTML ESCAPING
--------------------------------------------------------- */

function escapeHTML(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(value){
  return escapeHTML(value);
}

/* ---------------------------------------------------------
   RENDER
--------------------------------------------------------- */

function render(){

  let html="";

  if(currentPage==="dashboard"){
    html=dashboard();
  }

  if(currentPage==="expenses"){
    html=expensesPage();
  }

  if(currentPage==="upcoming"){
    html=upcomingPage();
  }

  if(currentPage==="overdue"){
    html=overduePage();
  }

  if(currentPage==="people"){
    html=peoplePage();
  }

  if(currentPage==="banks"){
    html=banksPage();
  }

  if(currentPage==="reports"){
    html=reportsPage();
  }

  document.getElementById("app").innerHTML=html;

  document.querySelectorAll("[data-page]").forEach(b=>{
    b.classList.toggle(
      "active",
      b.dataset.page===currentPage
    );
  });
}
